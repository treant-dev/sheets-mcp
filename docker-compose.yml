services:
  app:
    # Built and published by .github/workflows/build.yml on every push to main.
    # The server only ever pulls it — no source checkout there.
    image: ghcr.io/treant-dev/sheets-mcp:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      # Service-account key, mounted read-only. Point GOOGLE_APPLICATION_CREDENTIALS
      # at this path in .env (or drop the mount and inline the key in
      # GOOGLE_SERVICE_ACCOUNT_JSON instead).
      - ./service-account.json:/secrets/service-account.json:ro
    ports:
      # Loopback only. TLS and the public entrance are the host's Caddy, which
      # already owns :80/:443 for the other services on this box — see README.
      - "127.0.0.1:8000:8000"
